<!DOCTYPE html>
<html>
<head>
    <title>Strum - Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000130;
            background-repeat: no-repeat;
            min-height: 100vh;
            margin: 0;
            padding: 40px 0;
        }
        .form-container {
            background-color: #ffffff;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 400px;
            margin: 0 auto;
        }
        h2, h3 { color: #333; margin-top: 0; }
        .brand { color: #e94560; letter-spacing: 2px; }
        hr { border: 1px solid #ddd; margin: 20px 0; }
        label { font-weight: bold; }
        input, select {
            width: 95%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #e94560;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover { background-color: #c73650; }
        footer { text-align: center; font-size: 12px; color: #666; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2 class="brand">Strum</h2>
        <h3>Create Your Account</h3>
        <p style="color:#666; font-size:13px;">Join for free lessons, 0% EMI offers and member-only deals.</p>

        <hr>

        <form id="regForm" onsubmit="return validateForm(event)">
            <label>Name :</label><br>
            <input type="text" name="name" id="name"><br><br>

            <label>Age :</label><br>
            <input type="number" name="age" id="age"><br><br>

            <label>Your Playing Level :</label><br>
            <select name="level" id="level">
                <option value="">-- Choose Level --</option>
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced / Professional</option>
            </select><br><br>

            <label>City :</label><br>
            <input type="text" name="city" id="city"><br><br>

            <label>Email Address :</label><br>
            <input type="email" name="email" id="email"><br><br>

            <label>Create Password :</label><br>
            <input type="password" name="password" id="password"><br><br>

            <button type="submit">Register</button>
        </form>

        <hr>

        <footer>
            <p>Already registered? <a href="login.html">Login here</a></p>
            <p>&copy; 2026 Strum Music Store</p>
        </footer>
    </div>

    <script>
        async function validateForm(event) {
            if (event) event.preventDefault();

            const formData = {
                name: document.getElementById("name").value.trim(),
                age: document.getElementById("age").value.trim(),
                level: document.getElementById("level").value,
                city: document.getElementById("city").value.trim(),
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
            };

            if (!formData.name || !formData.age || !formData.level || !formData.city || !formData.email || !formData.password) {
                alert("All fields must be filled out!");
                return false;
            }

            try {
                const response = await fetch('http://localhost:3000/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                alert(result.message);

                if (result.success) {
                    window.location.href = "login.html";
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Could not connect to the server. Make sure server.js is running!");
            }

            return false;
        }
    </script>
</body>
</html>
